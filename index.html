<script>
let listeDonnees = [];

// Ton URL CSV Google Sheets
const csvUrl = "https://docs.google.com/spreadsheets/d/1WoljD9602RcG-fD2XKYtwsS0CU9Z8AXbB611ReG_LF8/export?format=csv";

fetch(csvUrl)
  .then(response => response.text())
  .then(text => {
    listeDonnees = text.split('\n').map(val => val.trim().toLowerCase());
    console.log("Données chargées :", listeDonnees);
  })
  .catch(err => console.error("Erreur de chargement :", err));

function verifier() {
  const valeur = document.getElementById('inputValue').value.trim().toLowerCase();
  const result = document.getElementById('result');
  if (listeDonnees.includes(valeur)) {
    result.textContent = "✅ Oui, cette donnée existe";
    result.style.color = "green";
  } else {
    result.textContent = "❌ Non, cette donnée n'existe pas";
    result.style.color = "red";
  }
}
</script>
