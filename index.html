<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--blue-light:#e6f0ff;
--blue-medium:#4a90e2;
--blue-dark:#003366;
--blue-clear:#00aaff;
--green:#28a745;
--red:#dc3545;
--orange:#ff9800;
--white:#ffffff;
--black:#000000;
}


body{
font-family: 'Playfair Display', serif;
margin:0;
background:var(--blue-light);
color:var(--black);
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:10px;
}


.header-promo{
text-align:center;
margin-bottom:20px;
line-height:1.6;
}


.header-promo .validated{
color: var(--blue-clear);

font-family: 'Roboto', sans-serif;
}


.header-promo .percentage{
color: var(--blue-dark);
font-weight: bold;
font-family: 'Roboto', sans-serif;
}


.container{
background:var(--white);
border-radius:20px;
box-shadow:0 12px 30px rgba(0,0,0,.15);
padding:40px 20px;
width:100%;
max-width:600px;
margin:0 auto 30px;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
transition: transform 0.3s ease;

}


h1{
text-align:center;
margin-bottom:24px;
color:var(--blue-dark);
font-size:28px;
font-family: 'Playfair Display', serif;
}


label{
font-weight:500;
text-align:center;
margin-bottom:12px;
display:block;
font-family: 'Roboto', sans-serif;
}


.input-group{
display:flex;
justify-content:center;
width:100%;
flex-wrap: wrap;
<body>

  <div class="header-promo">
    Avec un compte <span class="validated">Validé</span> bénéficiez à plusieurs promotions importantes pour vous aider.<br>
    Bonus de bienvenue pour les <span class="percentage">100%</span><br>
    Bonus de Cashback<br>
    Bonus du mercredi <span class="percentage">100%</span>
  </div>

  <div class="container">
    <h1>Vérifier votre compte +++++</h1>
    <label for="inputValue">Entrer votre identifiant pour verifier votre compte :</label>
    <div class="input-group">
      <input type="text" id="inputValue" placeholder="Entrez votre identifiant">
      <button onclick="verifier()">Vérifier</button>
    </div>
    <div class="footer">
      <span class="blue-bold">Votre compte n'est pas encore validé ?</span> <a href="https://refpa58144.com/L?tag=d_4010241m_1573c_&site=4010241&ad=1573&r=registration" target="_blank">Inscrivez-vous à nouveau</a> et entrez le code promotionnel UNIQUE pour la Tunisie : <span class="blue-bold">TUNBONUS</span>.
    </div>
  </div>

  <div id="result"></div>

  <div class="center-footer">
    <p>Découvrez notre chaîne YouTube pour ne rien manquer et profitez d'un bonus exclusif. <a href="https://www.youtube.com/@1XBET.MELBET.Tunisie" target="_blank">Regardez maintenant</a></p>
    <p>Si vous rencontrez des difficultés sur notre site, n'hésitez pas à nous contacter :</p>
    <p>Facebook: <a href="https://www.facebook.com/profile.php?id=100087654306111" target="_blank">Cliquez ici</a></p>
    <p>Notre groupe Facebook: <a href="https://www.facebook.com/groups/3805921359418509" target="_blank">Rejoignez-nous</a></p>
  </div>

  <script>
    let dataSet = new Set();

    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSURGCorr7Tp1G_ajjPW1m_9vqhW7uDSM7R4RWrti96xYN79gizSEz07jwAo6wjmN-LqU7rMN0p4bT8/pub?output=csv";

    fetch(csvUrl)
      .then(res => res.text())
      .then(text => {
        const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l!=='');
        dataSet = new Set(lines.map(l=>l.toLowerCase()));
      })
      .catch(err => alert("Erreur de chargement : vérifie que ton Google Sheet est publié sur le web."));

    function verifier(){
      const v = document.getElementById('inputValue').value.trim().toLowerCase();
      const out = document.getElementById('result');
      out.classList.remove('show');

      if(!v){
        out.textContent = 'Entrez une valeur à vérifier.';
        out.style.color='white';
        out.style.backgroundColor='#ff9800';
        out.style.borderColor='#ff9800';
      } else if(dataSet.has(v)){
        out.textContent = '🎉 Félicitation votre compte est validé et vous pouvez faire des dépôts';
        out.style.color='white';
        out.style.backgroundColor='#28a745';
        out.style.borderColor='#28a745';
      } else {
        out.innerHTML = '❌ Malheureusement, votre compte n\'est validé, vous devez créer un autre compte en utilisant ce lien <a href="https://refpa58144.com/L?tag=d_4010241m_1573c_&site=4010241&ad=1573&r=registration" target="_blank">Inscrivez-vous</a>';
        out.style.color='white';
        out.style.backgroundColor='#dc3545';
        out.style.borderColor='#dc3545';
      }

      out.classList.add('show');
      setTimeout(()=>{ out.classList.remove('show'); }, 30000);
    }
  </script>

</body>
</html>
